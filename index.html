<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Housebets Sportsbook — 5 Main Pages Prototype</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hbBg: '#090d13',
            hbNav: '#0e141c',
            hbCard: '#131b26',
            hbSubCard: '#182332',
            hbBorder: '#1e2b3c',
            hbBorderLight: '#26374d',
            hbTeal: '#00e6a7',
            hbTealHover: '#00c790',
            hbMuted: '#94a3b8',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #090d13;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // ==========================================
    // CLUB BADGES (HIGH-RES CRESTS)
    // ==========================================
    const CRESTS = {
      'Arsenal': 'https://crests.football-data.org/57.png',
      'Brighton & Hove Albion': 'https://crests.football-data.org/397.png',
      'Brighton': 'https://crests.football-data.org/397.png',
      'Real Madrid': 'https://crests.football-data.org/86.png',
      'Barcelona': 'https://crests.football-data.org/81.png',
      'Manchester City': 'https://crests.football-data.org/65.png',
      'Liverpool': 'https://crests.football-data.org/64.png',
      'Bayern Munich': 'https://crests.football-data.org/5.png',
      'Inter Milan': 'https://crests.football-data.org/108.png',
      'Juventus': 'https://crests.football-data.org/109.png',
      'Borussia Dortmund': 'https://crests.football-data.org/4.png',
      'AC Milan': 'https://crests.football-data.org/98.png',
      'RB Leipzig': 'https://crests.football-data.org/721.png',
    };

    const ClubBadge = ({ name, size = 20 }) => (
      <img
        src={CRESTS[name] || 'https://crests.football-data.org/57.png'}
        alt={name}
        style={{ width: size, height: size }}
        className="object-contain inline-block shrink-0 drop-shadow-sm select-none"
        loading="lazy"
        onError={(e) => { e.target.style.display = 'none'; }}
      />
    );

    // ==========================================
    // INLINE SVG ICONS
    // ==========================================
    const Icon = ({ path, size = 16, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {path}
      </svg>
    );

    const Icons = {
      Home: (p) => <Icon {...p} path={<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>} />,
      Radio: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></>} />,
      Trophy: (p) => <Icon {...p} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>} />,
      Soccer: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="m12 2 2.5 5.5-2.5 3.5-2.5-3.5L12 2Z"/><path d="M4 10l5.5 1-1.5 4.5-4-1.5V10Z"/><path d="M20 10l-5.5 1 1.5 4.5 4-1.5V10Z"/><path d="M7 20l2-4.5 4 1-1 4.5-5-1Z"/><path d="M17 20l-2-4.5-4 1 1 4.5 5-1Z"/></>} />,
      Receipt: (p) => <Icon {...p} path={<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></>} />,
      History: (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>} />,
      Search: (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>} />,
      Star: ({ filled, ...p }) => (
        <svg width={p.size || 16} height={p.size || 16} viewBox="0 0 24 24" fill={filled ? "#f59e0b" : "none"} stroke={filled ? "#f59e0b" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}>
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      ),
      Clock: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
      ArrowLeft: (p) => <Icon {...p} path={<><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>} />,
      Trash2: (p) => <Icon {...p} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>} />,
      TrendingUp: (p) => <Icon {...p} path={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>} />,
      ShieldAlert: (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></>} />,
      CheckCircle2: (p) => <Icon {...p} path={<><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></>} />,
      AlertTriangle: (p) => <Icon {...p} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></>} />,
      DollarSign: (p) => <Icon {...p} path={<><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></>} />,
      ChevronRight: (p) => <Icon {...p} path={<path d="m9 18 6-6-6-6"/>} />,
      Wallet: (p) => <Icon {...p} path={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></>} />,
      X: (p) => <Icon {...p} path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />
    };

    // ==========================================
    // REAL FIXTURES DATA
    // ==========================================
    const FIXTURES = [
      {
        id: 'ars-bri',
        competition: 'Premier League',
        homeTeam: 'Arsenal',
        awayTeam: 'Brighton & Hove Albion',
        isLive: true,
        minute: "64'",
        homeScore: 2,
        awayScore: 1,
        odds: { home: 1.55, draw: 4.20, away: 5.80 }
      },
      {
        id: 'rma-bar',
        competition: 'LaLiga',
        homeTeam: 'Real Madrid',
        awayTeam: 'Barcelona',
        isLive: true,
        minute: "38'",
        homeScore: 1,
        awayScore: 1,
        odds: { home: 2.15, draw: 3.40, away: 3.20 }
      },
      {
        id: 'mci-liv',
        competition: 'Premier League',
        homeTeam: 'Manchester City',
        awayTeam: 'Liverpool',
        isLive: false,
        startTime: 'Today, 20:00',
        odds: { home: 1.85, draw: 3.90, away: 3.95 }
      },
      {
        id: 'bay-int',
        competition: 'Champions League',
        homeTeam: 'Bayern Munich',
        awayTeam: 'Inter Milan',
        isLive: false,
        startTime: 'Tomorrow, 20:00',
        odds: { home: 1.65, draw: 4.00, away: 4.75 }
      },
      {
        id: 'juv-mil',
        competition: 'Serie A',
        homeTeam: 'Juventus',
        awayTeam: 'AC Milan',
        isLive: false,
        startTime: 'Tomorrow, 19:45',
        odds: { home: 2.30, draw: 3.10, away: 3.25 }
      },
      {
        id: 'dor-lep',
        competition: 'Bundesliga',
        homeTeam: 'Borussia Dortmund',
        awayTeam: 'RB Leipzig',
        isLive: false,
        startTime: 'Saturday, 17:30',
        odds: { home: 2.05, draw: 3.70, away: 3.35 }
      }
    ];

    function App() {
      // EXACTLY FIVE PAGES: 'home' | 'live' | 'football' | 'match' | 'betslip'
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedLeague, setSelectedLeague] = useState('All');
      const [liveSportFilter, setLiveSportFilter] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');
      const [favorites, setFavorites] = useState(['Arsenal', 'Premier League']);
      const [activeTabSlip, setActiveTabSlip] = useState('slip'); // 'slip' or 'mybets'

      // Singles Bet State (USDT)
      const [activeBet, setActiveBet] = useState({
        id: 'ars-bri-home',
        matchName: 'Arsenal vs Brighton & Hove Albion',
        marketName: 'Match Result',
        selectionName: 'Arsenal to Win',
        odds: 1.55,
        isSuspended: false
      });
      const [stake, setStake] = useState('25.00');
      const [oddsChanged, setOddsChanged] = useState(false);
      const [notification, setNotification] = useState(null);

      // My Bets
      const [myBets, setMyBets] = useState([
        {
          id: 'bet-1',
          matchName: 'Real Madrid vs Barcelona',
          marketName: 'Full Time Result',
          selectionName: 'Real Madrid',
          odds: 2.10,
          stake: 50,
          potentialReturn: 105.00,
          status: 'OPEN',
          cashoutAmount: 46.50
        },
        {
          id: 'bet-2',
          matchName: 'Manchester City vs Chelsea',
          marketName: 'Total Goals Over 2.5',
          selectionName: 'Over 2.5',
          odds: 1.70,
          stake: 100,
          potentialReturn: 170.00,
          status: 'WON'
        }
      ]);

      const showToast = (text, type = 'success') => {
        setNotification({ text, type });
        setTimeout(() => setNotification(null), 2500);
      };

      const handleSelectOdd = (sel) => {
        setOddsChanged(false);
        setActiveBet(sel);
        showToast(`Added "${sel.selectionName}" @ ${sel.odds.toFixed(2)} to Bet Slip`);
      };

      const simulateOddsChange = () => {
        if (!activeBet) return;
        const newOdds = +(activeBet.odds + 0.15).toFixed(2);
        setActiveBet({ ...activeBet, originalOdds: activeBet.odds, odds: newOdds });
        setOddsChanged(true);
        showToast(`Odds updated to ${newOdds.toFixed(2)} — requires acceptance`, 'error');
      };

      const toggleMarketSuspended = () => {
        if (!activeBet) return;
        setActiveBet({ ...activeBet, isSuspended: !activeBet.isSuspended });
        showToast(activeBet.isSuspended ? 'Markets un-suspended' : 'Markets suspended!', 'error');
      };

      const handlePlaceBet = () => {
        if (!activeBet) return;
        if (activeBet.isSuspended) {
          showToast('Market suspended! Bet placement unavailable.', 'error');
          return;
        }
        if (oddsChanged) {
          showToast('Please accept the updated odds first!', 'error');
          return;
        }
        const numericStake = parseFloat(stake);
        if (isNaN(numericStake) || numericStake <= 0) {
          showToast('Please enter a valid stake in USDT.', 'error');
          return;
        }
        if (numericStake > 500) {
          showToast('Failed: Stake exceeds 500 USDT balance limit.', 'error');
          return;
        }

        const newBet = {
          id: 'bet-' + Date.now(),
          matchName: activeBet.matchName,
          marketName: activeBet.marketName,
          selectionName: activeBet.selectionName,
          odds: activeBet.odds,
          stake: numericStake,
          potentialReturn: +(numericStake * activeBet.odds).toFixed(2),
          status: 'OPEN',
          cashoutAmount: +(numericStake * 0.94).toFixed(2)
        };

        setMyBets([newBet, ...myBets]);
        setActiveBet(null);
        showToast('Bet placed successfully in USDT!');
        setActiveTabSlip('mybets');
      };

      const cashOut = (id) => {
        setMyBets(myBets.map(b => b.id === id ? { ...b, status: 'CASHED_OUT' } : b));
        showToast('Cash out completed successfully!');
      };

      // Search & Filters
      const filteredFixtures = useMemo(() => {
        if (!searchQuery.trim()) return FIXTURES;
        const q = searchQuery.toLowerCase();
        return FIXTURES.filter(m =>
          m.homeTeam.toLowerCase().includes(q) ||
          m.awayTeam.toLowerCase().includes(q) ||
          m.competition.toLowerCase().includes(q)
        );
      }, [searchQuery]);

      const liveMatches = useMemo(() => {
        return filteredFixtures.filter(m => {
          if (!m.isLive) return false;
          if (liveSportFilter === 'Football' && m.competition !== 'Premier League' && m.competition !== 'LaLiga') return false;
          if (liveSportFilter === 'Tennis' || liveSportFilter === 'Basketball') return false;
          return true;
        });
      }, [filteredFixtures, liveSportFilter]);

      // Exactly 5 Pages navigation items
      const FIVE_PAGES = [
        { id: 'home', label: '1. Sports Home', icon: Icons.Home },
        { id: 'live', label: '2. Live', icon: Icons.Radio, badge: FIXTURES.filter(m => m.isLive).length },
        { id: 'football', label: '3. Football', icon: Icons.Trophy },
        { id: 'match', label: '4. Match Page', icon: Icons.Soccer },
        { id: 'betslip', label: '5. Bet Slip & My Bets', icon: Icons.Receipt, badge: activeBet ? '1' : null },
      ];

      return (
        <div className="min-h-screen bg-hbBg text-slate-100 flex flex-col font-sans pb-24 md:pb-12">
          
          {/* TOAST POPUP */}
          {notification && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg text-xs font-bold shadow-2xl flex items-center gap-2 border animate-bounce ${
              notification.type === 'success'
                ? 'bg-[#0f2a22] text-hbTeal border-hbTeal/50'
                : 'bg-[#2e1419] text-rose-300 border-rose-500/50'
            }`}>
              {notification.type === 'success' ? <Icons.CheckCircle2 size={16} /> : <Icons.AlertTriangle size={16} />}
              <span>{notification.text}</span>
            </div>
          )}

          {/* TOP HEADER */}
          <header className="sticky top-0 z-40 bg-hbNav/95 backdrop-blur-md border-b border-hbBorder px-4 py-2.5">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Brand Logo */}
              <div onClick={() => setCurrentPage('home')} className="flex items-center gap-2.5 cursor-pointer select-none">
                <div className="w-8 h-8 rounded-lg bg-teal-950/80 border border-hbTeal/50 flex items-center justify-center font-black text-hbTeal text-sm shadow-[0_0_12px_rgba(0,230,167,0.25)]">
                  HB
                </div>
                <div className="flex flex-col">
                  <span className="font-black tracking-wider text-white text-base leading-none">
                    HOUSE<span className="text-hbTeal">BETS</span>
                  </span>
                  <span className="text-[9px] uppercase tracking-widest text-hbMuted font-bold">SPORTSBOOK</span>
                </div>
              </div>

              {/* Desktop Global Search */}
              <div className="hidden md:flex flex-1 max-w-md relative">
                <Icons.Search size={14} className="absolute left-3.5 top-1/2 -translate-y-1/2 text-hbMuted" />
                <input
                  type="text"
                  placeholder="Search Arsenal, Real Madrid, Premier League..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#131b26] border border-hbBorder rounded-lg pl-9 pr-8 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-hbTeal transition-all shadow-inner"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                    <Icons.X size={14} />
                  </button>
                )}
              </div>

              {/* USDT Balance */}
              <div className="flex items-center gap-3">
                <div className="bg-hbCard border border-hbBorder rounded-lg px-3 py-1.5 flex items-center gap-2 shadow-sm">
                  <Icons.Wallet size={15} className="text-hbTeal" />
                  <div className="flex flex-col text-right">
                    <span className="text-[9px] text-hbMuted font-bold uppercase tracking-wider leading-none">USDT Balance</span>
                    <span className="text-xs font-mono font-black text-hbTeal leading-tight">1,245.80 ₮</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Mobile Search Input */}
            <div className="mt-2 md:hidden relative">
              <Icons.Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-hbMuted" />
              <input
                type="text"
                placeholder="Search teams, competitions..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full bg-[#131b26] border border-hbBorder rounded-lg pl-8 pr-8 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-hbTeal"
              />
            </div>
          </header>

          {/* ======================================================== */}
          {/* THE 5 DEDICATED MAIN PAGES BAR (TOP NAVIGATION)         */}
          {/* ======================================================== */}
          <nav className="bg-[#0b1017] border-b border-hbBorder px-3 py-2 sticky top-[57px] z-30 shadow-md">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-1 overflow-x-auto scrollbar-none">
              <div className="flex items-center gap-1.5 w-full">
                {FIVE_PAGES.map(page => {
                  const PageIcon = page.icon;
                  const isActive = currentPage === page.id;
                  return (
                    <button
                      key={page.id}
                      onClick={() => setCurrentPage(page.id)}
                      className={`flex-1 sm:flex-initial flex items-center justify-center gap-2 px-3.5 py-2 rounded-lg text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all ${
                        isActive
                          ? 'bg-hbTeal text-slate-950 shadow-lg shadow-hbTeal/20 scale-[1.02]'
                          : 'bg-hbCard text-slate-300 hover:bg-hbSubCard hover:text-white border border-hbBorder'
                      }`}
                    >
                      <PageIcon size={14} className={isActive ? 'text-slate-950' : 'text-hbTeal'} />
                      <span>{page.label}</span>
                      {page.badge && (
                        <span className={`text-[9px] px-1.5 py-0.2 rounded-full font-bold ${
                          isActive ? 'bg-slate-950 text-hbTeal' : 'bg-teal-950 text-hbTeal border border-hbTeal/40'
                        }`}>
                          {page.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          </nav>

          {/* ======================================================== */}
          {/* MAIN CONTAINER: EXACTLY 5 DISTINCT PAGES                */}
          {/* ======================================================== */}
          <main className="max-w-7xl w-full mx-auto p-3 sm:p-5 flex-1">

            {/* ====================================================== */}
            {/* PAGE 1: SPORTS HOME                                    */}
            {/* ====================================================== */}
            {currentPage === 'home' && (
              <div className="space-y-5 animate-in fade-in duration-150">
                
                {/* Page Title Badge */}
                <div className="flex items-center justify-between bg-hbCard border border-hbBorder rounded-xl p-3">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-hbTeal" />
                    <h1 className="text-xs font-black tracking-widest text-white uppercase">PAGE 1 — SPORTS HOME OVERVIEW</h1>
                  </div>
                  <span className="text-[10px] text-hbMuted font-bold">Quick Overview of Sportsbook</span>
                </div>

                {/* Sports Navigation Horizontal Carousel */}
                <div>
                  <div className="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
                    {['All Sports', 'Football', 'Basketball', 'Tennis', 'Ice Hockey', 'MMA', 'Baseball', 'Table Tennis'].map((sport, idx) => (
                      <button
                        key={sport}
                        onClick={() => { if (sport === 'Football') setCurrentPage('football'); }}
                        className={`px-3.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap border transition-all ${
                          idx === 0
                            ? 'bg-hbTeal text-slate-950 border-hbTeal shadow-sm'
                            : 'bg-hbCard text-slate-300 border-hbBorder hover:border-slate-500'
                        }`}
                      >
                        {sport}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Top Competitions */}
                <div>
                  <h2 className="text-[11px] uppercase font-black tracking-wider text-hbMuted mb-2 flex items-center gap-1.5">
                    <Icons.Trophy size={14} className="text-hbTeal" /> Top Competitions
                  </h2>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    {['Premier League', 'Champions League', 'LaLiga', 'Serie A'].map(comp => (
                      <div
                        key={comp}
                        onClick={() => { setSelectedLeague(comp); setCurrentPage('football'); }}
                        className="bg-hbCard hover:bg-hbSubCard border border-hbBorder rounded-xl p-3 cursor-pointer flex justify-between items-center transition-all group"
                      >
                        <span className="text-xs font-bold text-white group-hover:text-hbTeal truncate">{comp}</span>
                        <Icons.ChevronRight size={13} className="text-hbMuted group-hover:text-hbTeal" />
                      </div>
                    ))}
                  </div>
                </div>

                {/* Live Now (In Play) Preview */}
                <div className="bg-hbCard border border-hbBorder rounded-xl p-4 shadow-sm">
                  <div className="flex items-center justify-between mb-3 border-b border-hbBorder pb-2.5">

                          onClick={() => handleSelectOdd({
                            id: `h-${h.name}`,
                            matchName: 'Arsenal vs Brighton & Hove Albion',
                            marketName: '2nd Half Winner',
                            selectionName: h.name,
                            odds: h.odds
                          })}
                          className="bg-hbSubCard hover:bg-[#1d2938] border border-hbBorder p-2.5 rounded-xl flex flex-col items-center"
                        >
                          <span className="text-[10px] text-slate-300">{h.name}</span>
                          <span className="text-xs font-mono font-black text-hbTeal mt-0.5">{h.odds.toFixed(2)}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* GROUP 4: Handicaps */}
                  <div className="bg-hbCard border border-hbBorder rounded-xl p-4">
                    <h3 className="font-bold text-xs uppercase text-slate-300 mb-2.5">4. Handicaps: Asian Handicap (-1.5)</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { name: 'Arsenal (-1.5)', odds: 2.35 },
                        { name: 'Brighton (+1.5)', odds: 1.58 }
                      ].map(hc => (
                        <button
                          key={hc.name}
                          onClick={() => handleSelectOdd({
                            id: `hc-${hc.name}`,
                            matchName: 'Arsenal vs Brighton & Hove Albion',
                            marketName: 'Asian Handicap',
                            selectionName: hc.name,
                            odds: hc.odds
                          })}
                          className="bg-hbSubCard hover:bg-[#1d2938] border border-hbBorder p-2.5 rounded-xl flex justify-between items-center"
                        >
                          <span className="text-xs text-slate-300">{hc.name}</span>
                          <span className="text-xs font-mono font-black text-hbTeal">{hc.odds.toFixed(2)}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* GROUP 5: Goalscorers */}
                  <div className="bg-hbCard border border-hbBorder rounded-xl p-4">
                    <h3 className="font-bold text-xs uppercase text-slate-300 mb-2.5">5. Goalscorers: Anytime Goalscorer</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {[
                        { name: 'Bukayo Saka (Arsenal)', odds: 2.80 },
                        { name: 'Kai Havertz (Arsenal)', odds: 3.10 },
                        { name: 'Danny Welbeck (Brighton)', odds: 4.50 },
                        { name: 'Kaoru Mitoma (Brighton)', odds: 5.20 }
                      ].map(sc => (
                        <button
                          key={sc.name}
                          onClick={() => handleSelectOdd({
                            id: `sc-${sc.name}`,
                            matchName: 'Arsenal vs Brighton & Hove Albion',
                            marketName: 'Anytime Goalscorer',
                            selectionName: sc.name,
                            odds: sc.odds
                          })}
                          className="bg-hbSubCard hover:bg-[#1d2938] border border-hbBorder p-2.5 rounded-xl flex justify-between items-center"
                        >
                          <span className="text-xs text-slate-300">{sc.name}</span>
                          <span className="text-xs font-mono font-black text-hbTeal">{sc.odds.toFixed(2)}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* GROUP 6: Corners & Cards */}
                  <div className="bg-hbCard border border-hbBorder rounded-xl p-4">
                    <h3 className="font-bold text-xs uppercase text-slate-300 mb-2.5">6. Corners & Cards</h3>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { name: 'Over 9.5 Total Corners', odds: 1.88 },
                        { name: 'Under 9.5 Total Corners', odds: 1.95 },
                        { name: 'Over 4.5 Total Cards', odds: 2.02 },
                        { name: 'Under 4.5 Total Cards', odds: 1.80 }
                      ].map(cc => (
                        <button
                          key={cc.name}
                          onClick={() => handleSelectOdd({
                            id: `cc-${cc.name}`,
                            matchName: 'Arsenal vs Brighton & Hove Albion',
                            marketName: 'Corners & Cards',
                            selectionName: cc.name,
                            odds: cc.odds
                          })}
                          className="bg-hbSubCard hover:bg-[#1d2938] border border-hbBorder p-2.5 rounded-xl flex justify-between items-center"
                        >
                          <span className="text-xs text-slate-300">{cc.name}</span>
                          <span className="text-xs font-mono font-black text-hbTeal">{cc.odds.toFixed(2)}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                </div>

              </div>
            )}

            {/* ====================================================== */}
            {/* PAGE 5: DEDICATED BET SLIP & MY BETS PAGE              */}
            {/* ====================================================== */}
            {currentPage === 'betslip' && (
              <div className="space-y-4 animate-in fade-in duration-150 max-w-xl mx-auto">
                
                {/* Page Title Badge */}
                <div className="bg-hbCard border border-hbBorder rounded-xl p-4 flex items-center justify-between">
                  <div>
                    <h1 className="text-sm font-black text-white uppercase tracking-wider">PAGE 5 — BET SLIP & MY BETS</h1>
                    <p className="text-xs text-hbMuted">Combined view: Singles in USDT & Open/Settled bets with Cashout</p>
                  </div>
                  <span className="text-xs font-mono font-bold text-hbTeal bg-teal-950/80 border border-hbTeal/30 px-2.5 py-1 rounded">
                    100% USDT Singles
                  </span>
                </div>

                {/* Sub-Navigation: Bet Slip vs My Bets */}
                <div className="grid grid-cols-2 gap-1.5 bg-[#101720] p-1.5 rounded-xl border border-hbBorder">
                  <button
                    onClick={() => setActiveTabSlip('slip')}
                    className={`py-2.5 text-xs font-bold rounded-lg transition-all ${
                      activeTabSlip === 'slip'
                        ? 'bg-hbTeal text-slate-950 shadow-md font-black'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Active Bet Slip {activeBet && '(1 Selection)'}
                  </button>
                  <button
                    onClick={() => setActiveTabSlip('mybets')}
                    className={`py-2.5 text-xs font-bold rounded-lg transition-all ${
                      activeTabSlip === 'mybets'
                        ? 'bg-hbTeal text-slate-950 shadow-md font-black'
                        : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    My Bets History ({myBets.length})
                  </button>
                </div>

                {/* SECTION 1: BET SLIP */}
                {activeTabSlip === 'slip' && (
                  <div className="bg-hbCard border border-hbBorder rounded-2xl p-5 shadow-xl space-y-4">
                    <div className="flex items-center justify-between border-b border-hbBorder pb-3">
                      <span className="text-xs uppercase font-extrabold tracking-wider text-white flex items-center gap-1.5">
                        <Icons.Receipt size={16} className="text-hbTeal" /> Singles Bet Slip (USDT)
                      </span>
                      {activeBet && (
                        <button onClick={() => setActiveBet(null)} className="text-slate-400 hover:text-rose-400 text-xs flex items-center gap-1">
                          <Icons.Trash2 size={14} /> Clear Selection
                        </button>
                      )}
                    </div>

                    {!activeBet ? (
                      <div className="py-12 text-center text-slate-400">
                        <Icons.Receipt size={32} className="mx-auto mb-2 opacity-30 text-hbTeal" />
                        <p className="text-sm font-bold">Your Bet Slip is empty</p>
                        <p className="text-xs text-slate-500 mt-1">Select odds on any match to place a single bet.</p>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <div className="bg-[#101720] p-3.5 rounded-xl border border-hbBorder">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-[10px] uppercase font-black tracking-wider text-hbTeal block">Single Bet Selection</span>
                              <h4 className="font-extrabold text-sm text-white mt-0.5">{activeBet.selectionName}</h4>
                              <p className="text-xs text-slate-400 mt-0.5">{activeBet.marketName} • {activeBet.matchName}</p>
                            </div>
                            <span className="text-base font-mono font-black text-hbTeal bg-[#16202c] px-3 py-1 rounded border border-hbBorder">
                              {activeBet.odds.toFixed(2)}
                            </span>
                          </div>
                        </div>

                        {/* Odds Change Warning Banner */}
                        {oddsChanged && (
                          <div className="bg-amber-950/70 border border-amber-500/60 p-3 rounded-xl flex items-center justify-between">
                            <div className="text-xs text-amber-200">
                              Odds changed: <span className="line-through text-slate-400">{activeBet.originalOdds}</span> → <strong className="text-white font-mono">{activeBet.odds}</strong>
                            </div>
                            <button
                              onClick={() => { setActiveBet({ ...activeBet, originalOdds: undefined }); setOddsChanged(false); }}
                              className="bg-amber-400 hover:bg-amber-300 text-black font-extrabold text-xs px-3 py-1 rounded-md"
                            >
                              Accept New Odds
                            </button>
                          </div>
                        )}

                        {/* Market Suspended Alert */}
                        {activeBet.isSuspended && (
                          <div className="bg-rose-950 border border-rose-500 p-3 rounded-xl text-xs text-rose-300 font-bold flex items-center gap-2">
                            <Icons.ShieldAlert size={16} /> Market is suspended. Bet cannot be placed at this time.
                          </div>
                        )}

                        {/* Stake input */}
                        <div>
                          <div className="flex justify-between text-xs font-bold text-slate-300 mb-1.5">
                            <span>Stake Amount (USDT)</span>
                            <span className="text-slate-500">Max Demo Limit: 500 USDT</span>
                          </div>
                          <div className="relative">
                            <input
                              type="number"
                              value={stake}
                              onChange={(e) => setStake(e.target.value)}
                              className="w-full bg-[#101720] border border-hbBorder focus:border-hbTeal rounded-xl py-3 pl-8 pr-16 text-white font-mono font-bold text-base focus:outline-none"
                            />
                            <span className="absolute left-3 top-3.5 text-slate-400 text-xs">₮</span>
                            <span className="absolute right-3.5 top-3.5 text-slate-400 text-xs font-bold">USDT</span>
                          </div>

                          {/* Quick Chips */}
                          <div className="grid grid-cols-4 gap-2 mt-2">
                            {['10', '25', '50', '100'].map(val => (
                              <button
                                key={val}
                                onClick={() => setStake(val)}
                                className="bg-[#101720] hover:bg-hbSubCard border border-hbBorder py-1.5 text-xs text-slate-300 font-mono font-bold rounded-lg"
                              >
                                +{val} USDT
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* Summary & Payout */}
                        <div className="border-t border-hbBorder pt-3 text-xs space-y-1.5">
                          <div className="flex justify-between text-slate-400">
                            <span>Total Stake:</span>
                            <span className="text-white font-mono font-semibold">{stake || '0.00'} USDT</span>
                          </div>
                          <div className="flex justify-between font-bold text-sm">
                            <span className="text-slate-300">Potential Return:</span>
                            <span className="text-hbTeal font-mono font-black text-base">
                              {!isNaN(parseFloat(stake)) ? (parseFloat(stake) * activeBet.odds).toFixed(2) : '0.00'} USDT
                            </span>
                          </div>
                        </div>

                        {/* Bet Placement Button */}
                        <button
                          onClick={handlePlaceBet}
                          disabled={activeBet.isSuspended}
                          className={`w-full py-3.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all ${
                            activeBet.isSuspended
                              ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                              : 'bg-hbTeal hover:bg-hbTealHover text-slate-950 shadow-lg shadow-hbTeal/20 active:scale-[0.99]'
                          }`}
                        >
                          PLACE BET (USDT)
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* SECTION 2: MY BETS (OPEN, SETTLED, CASHOUT) */}
                {activeTabSlip === 'mybets' && (
                  <div className="space-y-3">
                    {myBets.map(b => (
                      <div key={b.id} className="bg-hbCard border border-hbBorder rounded-xl p-4 shadow-sm">
                        <div className="flex justify-between items-start mb-2">
                          <div>
                            <h5 className="font-extrabold text-sm text-white">{b.selectionName}</h5>
                            <p className="text-xs text-slate-400">{b.marketName} • {b.matchName}</p>
                          </div>
                          <span className={`text-[10px] font-black px-2 py-0.5 rounded tracking-wider ${
                            b.status === 'WON'
                              ? 'bg-emerald-950 text-emerald-400 border border-emerald-800'
                              : b.status === 'CASHED_OUT'
                              ? 'bg-amber-950 text-amber-400 border border-amber-800'
                              : 'bg-teal-950 text-hbTeal border border-hbTeal/40'
                          }`}>
                            {b.status}
                          </span>
                        </div>

                        <div className="grid grid-cols-3 gap-2 bg-[#101720] p-2.5 rounded-lg text-xs my-2.5 border border-hbBorder font-mono">
                          <div>
                            <span className="text-[10px] text-slate-500 block">Decimal Odds</span>
                            <span className="font-bold text-white">{b.odds.toFixed(2)}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Stake</span>
                            <span className="font-bold text-white">{b.stake} ₮</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-500 block">Potential Return</span>
                            <span className="font-bold text-hbTeal">{b.potentialReturn} ₮</span>
                          </div>
                        </div>

                        {/* Working Cashout Option */}
                        {b.status === 'OPEN' && b.cashoutAmount && (
                          <button
                            onClick={() => cashOut(b.id)}
                            className="w-full py-2 bg-[#172433] hover:bg-[#1f3044] border border-[#2a3f58] text-teal-300 font-extrabold text-xs rounded-lg flex items-center justify-center gap-1.5 font-mono transition-colors"
                          >
                            <Icons.DollarSign size={13} /> Cash Out Now: {b.cashoutAmount} USDT
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ======================================================== */}
          {/* FIXED MOBILE BOTTOM NAVIGATION (5 SECTIONS)              */}
          {/* ======================================================== */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-[#0d131b]/95 backdrop-blur-md border-t border-hbBorder px-2 py-1">
            <div className="flex justify-around items-center h-14">
              {FIVE_PAGES.map(item => {
                const IconComponent = item.icon;
                const isActive = currentPage === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setCurrentPage(item.id)}
                    className={`relative flex flex-col items-center justify-center flex-1 py-1 transition-colors ${
                      isActive ? 'text-hbTeal font-bold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <div className="relative">
                      <IconComponent size={19} />
                      {item.badge && (
                        <span className="absolute -top-1.5 -right-2 bg-hbTeal text-slate-950 font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                          {item.badge}
                        </span>
                      )}
                    </div>
                    <span className={`text-[10px] mt-1 font-semibold ${isActive ? 'text-hbTeal' : 'text-slate-400'}`}>
                      {item.label.replace(/^[0-9]\.\s*/, '')}
                    </span>
                    {isActive && (
                      <span className="absolute bottom-0 w-8 h-0.5 bg-hbTeal rounded-full shadow-[0_0_8px_#00e6a7]" />
                    )}
                  </button>
                );
              })}
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
